function show(){const item=data[idx];$('en').textContent=item.en;$('zh').textContent=item.zh;$('count').textContent=String(idx+1).padStart(2,'0')+' / '+String(data.length).padStart(2,'0');$('bar').style.width=((idx+1)/data.length*100)+'%';$('back').disabled=idx===0;$('next').disabled=idx===data.length-1;}
function sync(){if(pendingSeek!==null)return;let i=0;while(i+1<marks.length&&player.currentTime>=marks[i+1])i++;if(i!==idx){idx=i;show();}}
function button(){ $('play').textContent=player.paused?(player.currentTime>0&&!player.ended?'▶ 继续':'▶ 开始跟读'):'Ⅱ 暂停'; }
async function play(){const id=++requestID;$('status').textContent='正在启动音频…';try{await player.play();if(id!==requestID)return;button();$('status').textContent='正在播放内置英语女声，字幕随音频逐句切换。';}catch(error){if(id!==requestID)return;button();$('status').textContent='音频未启动（'+error.name+'），请再次点击“开始跟读”。';}}
function startAt(i){idx=Math.max(0,Math.min(data.length-1,i));if(player.readyState>=1){player.currentTime=marks[idx];}else{pendingSeek=marks[idx];}show();play();}
$('play').addEventListener('click',()=>{if(!player.paused){requestID++;player.pause();$('status').textContent='已暂停，点击“继续”接着播放。';}else{if(player.ended){player.currentTime=0;idx=0;show();}play();}});
$('again').addEventListener('click',()=>startAt(idx));$('back').addEventListener('click',()=>startAt(idx-1));$('next').addEventListener('click',()=>startAt(idx+1));
$('rate').addEventListener('input',e=>{player.playbackRate=Number(e.target.value);$('rateLabel').textContent=Number(e.target.value).toFixed(2)+'×';});
player.addEventListener('loadedmetadata',()=>{if(pendingSeek!==null){player.currentTime=pendingSeek;pendingSeek=null;}});
player.addEventListener('timeupdate',sync);player.addEventListener('seeked',sync);player.addEventListener('play',button);player.addEventListener('pause',button);player.addEventListener('ended',()=>{idx=data.length-1;show();button();$('status').textContent='朗读完成，点击“开始跟读”重新播放。';});
player.addEventListener('error',()=>{$('status').textContent='音频加载失败，请刷新页面重试。';button();});
